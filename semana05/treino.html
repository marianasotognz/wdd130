<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo de rowspan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    table {
      border-collapse: collapse;
      width: 400px;
    }

    th,
    td {
      border: 1px solid black;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }
  </style>
</head>

<body>

  <h1>Exemplo de rowspan</h1>

  <p>
    A célula com o nome <strong>Mariana</strong> ocupa duas linhas usando
    <code>rowspan="2"</code>.
  </p>

  <table>
    <tr>
      <th>Nome</th>
      <th>Curso</th>
    </tr>
    <tr>
      <td rowspan="2">Mariana</td>
      <td>HTML</td>
    </tr>
    <tr>
      <td>CSS</td>
    </tr>
  </table>

</body>

</html>
